route:
  receiver: local
  group_by: [alertname,severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Alert delivery is intentionally configured separately: production must not
  # contain a placeholder URL or credentials in source control. Alertmanager
  # still groups and retains alerts until an operations receiver is provisioned.
  - name: local
