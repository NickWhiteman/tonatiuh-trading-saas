name: Deploy production
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full commit SHA from main
        required: true
        type: string
      image_reference:
        description: Immutable ghcr.io backend image@sha256 digest
        required: true
        type: string
permissions: {contents: read, packages: read}
concurrency: {group: production-deployment, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: "${{ inputs.release_commit }}", fetch-depth: 0}
      - name: Validate immutable release
        env:
          EXPECTED_SHA: "${{ inputs.release_commit }}"
          IMAGE_REFERENCE: "${{ inputs.image_reference }}"
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          case "$IMAGE_REFERENCE" in ghcr.io/*@sha256:*) :;; *) exit 2;; esac
      - name: Configure pinned production SSH host
        env:
          SSH_PRIVATE_KEY: "${{ secrets.PRODUCTION_SSH_KEY }}"
          SSH_KNOWN_HOSTS: "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}"
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release configuration without deleting server state
        env:
          HOST: "${{ vars.PRODUCTION_HOST }}"
          USER: "${{ vars.PRODUCTION_USER }}"
        run: |
          rsync -az --exclude .git --exclude node_modules --exclude build \
            ./ "$USER@$HOST:/opt/tonatiuh/tonatiuh-trading-saas/"
      - name: Rolling deploy with automatic rollback
        env:
          HOST: "${{ vars.PRODUCTION_HOST }}"
          USER: "${{ vars.PRODUCTION_USER }}"
          RELEASE: "${{ inputs.release_commit }}"
          IMAGE_REFERENCE: "${{ inputs.image_reference }}"
        run: |
          ssh "$USER@$HOST" /opt/tonatiuh/tonatiuh-trading-saas/ops/deploy-swarm-release.sh \
            "$RELEASE" "$IMAGE_REFERENCE"
